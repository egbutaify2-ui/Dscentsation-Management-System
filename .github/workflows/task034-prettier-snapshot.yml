name: Task 034 Prettier snapshot (temporary)

on:
  push:
    branches:
      - task-034-customer-management-frontend

permissions:
  contents: read

jobs:
  snapshot:
    name: Format Task 034 frontend sources
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Task 034 head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.16.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture canonical Prettier output
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/web/src/components/AppShell.test.tsx
            apps/web/src/features/customers/CustomerManagementPage.test.tsx
            apps/web/src/features/customers/CustomerManagementPage.tsx
          )
          pnpm exec prettier --single-quote --trailing-comma all --print-width 100 --write "${files[@]}"
          for file in "${files[@]}"; do
            printf 'BEGIN_BASE64:%s\n' "$file"
            base64 -w 0 "$file"
            printf '\nEND_BASE64:%s\n' "$file"
          done
