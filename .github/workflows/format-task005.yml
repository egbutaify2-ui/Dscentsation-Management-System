name: One-time Task 005 source formatting

on:
  push:
    branches:
      - task-005-application-foundation
    paths:
      - .github/workflows/format-task005.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Task 005 branch
        uses: actions/checkout@v5
        with:
          ref: task-005-application-foundation
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Format tracked project source
        run: pnpm format

      - name: Commit formatting-only changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes are required."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps package.json tsconfig.base.json eslint.config.js docs/development
          git commit -m "style: format Task 005 test updates"
          git push origin HEAD:task-005-application-foundation
