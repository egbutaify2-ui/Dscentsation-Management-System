name: Temporary DMS Order UI Prettier output

on:
  push:
    branches:
      - task-030-prettier-export

permissions:
  contents: read

jobs:
  format:
    name: Format Task 025 failing files with repository Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact Task 025 commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 833abc524055bdddded16c05050a7906a4330dc6
          path: pr22
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the exact main toolchain
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 9ffb66d78bfb2a27e10ae98c06d67a916522afa9
          path: workspace
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.16.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: workspace/pnpm-lock.yaml

      - name: Install the exact repository toolchain
        working-directory: workspace
        run: pnpm install --frozen-lockfile

      - name: Format Task 025 order frontend files
        working-directory: pr22
        run: >
          ../workspace/node_modules/.bin/prettier
          --single-quote
          --trailing-comma all
          --print-width 100
          --write
          apps/web/src/features/orders/OrderManagementPage.test.tsx
          apps/web/src/features/orders/OrderManagementPage.tsx

      - name: Verify Task 025 order frontend formatting
        working-directory: pr22
        run: >
          ../workspace/node_modules/.bin/prettier
          --single-quote
          --trailing-comma all
          --print-width 100
          --check
          apps/web/src/features/orders/OrderManagementPage.test.tsx
          apps/web/src/features/orders/OrderManagementPage.tsx

      - name: Upload only the two formatted source files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dms-order-ui-prettier-output
          path: |
            pr22/apps/web/src/features/orders/OrderManagementPage.test.tsx
            pr22/apps/web/src/features/orders/OrderManagementPage.tsx
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
