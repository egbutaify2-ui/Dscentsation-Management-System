name: Temporary DMS Prettier output

on:
  push:
    branches:
      - task-030-prettier-export

permissions:
  contents: read

jobs:
  format:
    name: Format the six requested files with repository Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact Task 022 commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: f8b0758f12ba93b5fe80569df4368280aae30cd1
          path: pr18
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the exact Task 027 commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: b3808a15a7853d7529e6de345be44d566846e142
          path: pr23
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the exact main toolchain
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 9ffb66d78bfb2a27e10ae98c06d67a916522afa9
          path: workspace
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.16.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: workspace/pnpm-lock.yaml

      - name: Install the exact repository toolchain
        working-directory: workspace
        run: pnpm install --frozen-lockfile

      - name: Format Task 022 order files
        working-directory: pr18
        run: >
          ../workspace/node_modules/.bin/prettier
          --single-quote
          --trailing-comma all
          --print-width 100
          --write
          apps/api/src/modules/orders/order.database.test.ts
          apps/api/src/modules/orders/order.service.test.ts
          apps/api/src/modules/orders/order.postgres.repository.ts
          apps/api/src/modules/orders/order.routes.ts

      - name: Verify Task 022 order formatting
        working-directory: pr18
        run: >
          ../workspace/node_modules/.bin/prettier
          --single-quote
          --trailing-comma all
          --print-width 100
          --check
          apps/api/src/modules/orders/order.database.test.ts
          apps/api/src/modules/orders/order.service.test.ts
          apps/api/src/modules/orders/order.postgres.repository.ts
          apps/api/src/modules/orders/order.routes.ts

      - name: Format Task 027 audit files
        working-directory: pr23
        run: >
          ../workspace/node_modules/.bin/prettier
          --single-quote
          --trailing-comma all
          --print-width 100
          --write
          apps/api/src/modules/audit/audit.routes.test.ts
          apps/api/src/modules/audit/audit.service.ts

      - name: Verify Task 027 audit formatting
        working-directory: pr23
        run: >
          ../workspace/node_modules/.bin/prettier
          --single-quote
          --trailing-comma all
          --print-width 100
          --check
          apps/api/src/modules/audit/audit.routes.test.ts
          apps/api/src/modules/audit/audit.service.ts

      - name: Upload only the six formatted source files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dms-prettier-output
          path: |
            pr18/apps/api/src/modules/orders/order.database.test.ts
            pr18/apps/api/src/modules/orders/order.service.test.ts
            pr18/apps/api/src/modules/orders/order.postgres.repository.ts
            pr18/apps/api/src/modules/orders/order.routes.ts
            pr23/apps/api/src/modules/audit/audit.routes.test.ts
            pr23/apps/api/src/modules/audit/audit.service.ts
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
